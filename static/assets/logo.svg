<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="100%" height="100%">
  <!-- Fundo Dark Mode -->
  <rect width="100%" height="100%" fill="#111315" rx="12"/>
  
  <!-- Ícone: Escudo de Proteção + Linha de Assinatura Sanitária -->
  <g transform="translate(35, 20)">
    <!-- Escudo Geométrico Exterior -->
    <path d="M 45 8 L 78 22 V 50 C 78 72 45 88 45 88 C 45 88 12 72 12 50 V 22 L 45 8 Z" 
          fill="none" stroke="#00E699" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Linha de Assinatura Biométrica Interior -->
    <path d="M 30 46 C 36 34, 43 34, 45 46 C 47 58, 54 58, 60 46" 
          fill="none" stroke="#E2E8F0" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Ponto de Confirmação Legal -->
    <circle cx="45" cy="66" r="3.5" fill="#00E699"/>
  </g>
  
  <!-- Tipografia Principal -->
  <!-- INK (Firme e Caixas Altas) -->
  <text x="135" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#E2E8F0" letter-spacing="2">INK</text>
  
  <!-- GUARD (Leve e Tecnológico) -->
  <text x="212" y="65" font-family="system-ui, -apple-system, sans-serif" font-weight="300" font-size="36" fill="#00E699" letter-spacing="2">GUARD</text>
  
  <!-- Subtítulo / Tagline Legal -->
  <text x="137" y="88" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#717D96" letter-spacing="3.5">ANAMNESE &amp; TERMOS DIGITAIS</text>
</svg>
